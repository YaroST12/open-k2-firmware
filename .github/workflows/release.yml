# Cut a release: push a tag `vMAJOR.MINOR` (e.g. `git tag v1.2 && git push origin v1.2`; a third `.PATCH` part is accepted).
# The firmware is built through the full gate; its version string is derived from the tag (tools/fw_version.py: on the
# tag `v1.2` it reads `1.2.0-0-<hash>`), and a GitHub Release is
# created with open_k2.k2, open_k2.bin, open_k2.elf and SHA256SUMS attached (release notes generated from the commits).
# The bootloader's version byte holds two nibbles, so major and minor must each be 0-15; any other tag fails
# before the build. Pre-release tags (`v1.2-rc1`) are rejected for the same reason: the Pages flasher offers releases only.
#
# After the release exists, the last step starts pages.yml on `main` (`gh workflow run pages.yml --ref main`) so the
# flasher's "Flash release" button follows the new release. Two GitHub behaviours force this shape:
#   - A release created with the workflow's own GITHUB_TOKEN does not fire the `release: published` trigger (GitHub
#     does not start workflows from events caused by GITHUB_TOKEN). workflow_dispatch is the documented exception, so
#     the dispatch works with GITHUB_TOKEN; it needs `actions: write`.
#   - A Pages deploy that runs on a tag ref (a workflow_call from this tag-triggered workflow, or `release: published`)
#     reports success but does not go live: Pages keeps serving the earlier deployment. A deploy run on `main` does.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Version from the tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ ! "$v" =~ ^([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]] || (( 10#${BASH_REMATCH[1]} > 15 || 10#${BASH_REMATCH[2]} > 15 )); then
            echo "::error::tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR[.PATCH] with major and minor 0-15"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The release image carries the Xiaomi 0x2717 key table. It is never in the repository: the header comes from
      # the XIAOMI_KEYS_PRIV secret (and the host-test digests from XIAOMI_VECTORS_PRIV, so test_xiaomi_auth proves
      # the table arrived intact). Without the secret the release fails rather than ship the zero stubs.
      # ci.yml has no secrets and builds the stubs (include/k2/pd/xiaomi_keys.hpp).
      - name: Private key tables
        env:
          XIAOMI_KEYS_PRIV: ${{ secrets.XIAOMI_KEYS_PRIV }}
          XIAOMI_VECTORS_PRIV: ${{ secrets.XIAOMI_VECTORS_PRIV }}
        shell: bash
        run: |
          if [ -z "$XIAOMI_KEYS_PRIV" ]; then echo "::error::secret XIAOMI_KEYS_PRIV is not set"; exit 1; fi
          mkdir -p priv
          printf '%s\n' "$XIAOMI_KEYS_PRIV" > priv/xiaomi_keys_priv.h
          if [ -n "$XIAOMI_VECTORS_PRIV" ]; then printf '%s\n' "$XIAOMI_VECTORS_PRIV" > priv/xiaomi_vectors_priv.h; fi

      - uses: ./.github/actions/build-firmware
        with:
          gate: "true"                  # the version string is derived from the tag checked out (fetch-depth 0)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp build/open_k2.k2 build/open_k2.bin build/open_k2.elf dist/
          (cd dist && sha256sum open_k2.k2 open_k2.bin open_k2.elf > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            dist/open_k2.k2 dist/open_k2.bin dist/open_k2.elf dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Redeploy the Pages site from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
